# No secret is delivered by the deploy.
#
# Each container reads its own values from SSM at start, with the identity the
# trust appliance issued it, and the paths it reads are declared in
# compose.yaml beside the service that uses them (ahara-trust ADR-0002).
#
# Deliberately comment-only. The deploy resolves every non-comment line as
# KEY: /ssm/path, and a bare {} is treated as empty only when it is the whole
# file — which it stops being the moment anything explains why.
