# config.yaml (save as collector/config.yaml)
# Values here override the environment defaults in voltage_collector.py.
drain_interval: 10  # seconds to sleep when the collector stream is empty

# ahara-collector appliance (the kasa stream producer)
collector:
  module: "kasa"

# InfluxDB configuration
influxdb:
  enabled: true
  retention: "30d"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
