project: house-sensors
prefix: house-sensors
stack:
  - vendor
  - terraform
truenas: true
truenas_compose_path: compose.yaml
truenas_compose_check_paths:
  - compose.yaml
truenas_roles_anywhere:
  raw-archive:
    env_prefix: AWS_RA_RAW_ARCHIVE
  # Every container that holds a secret needs an identity to read it with,
  # because the deploy no longer carries the value (ahara-trust ADR-0002).
  environment-sensors:
    env_prefix: AWS_RA_ENVIRONMENT_SENSORS
  volt:
    env_prefix: AWS_RA_VOLT
  volt-event:
    env_prefix: AWS_RA_VOLT_EVENT
  downsampling:
    env_prefix: AWS_RA_DOWNSAMPLING
images:
  - collectors/environment-sensors
  - collectors/volt
  - management/volt-event
  - jobs/downsampling
observability:
  dashboards:
    path: observability/dashboards
    folder_uid: house-sensors
    folder_title: House Sensors
    prune: true
